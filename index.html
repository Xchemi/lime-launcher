function tab(n,b){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==n));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function lang(){document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(x=>x.textContent=tr(x.dataset.i));document.querySelectorAll('[data-p]').forEach(x=>x.placeholder=tr(x.dataset.p));render()}
function toggleLang(){L=L=='ru'?'en':'ru';st.settings.lang=L;$('#sl').value=L;$('#pt').textContent='';save();lang()}
function sel(i){st.sel=i;save();render()}
function render(){
  const q=$('#bq').value.toLowerCase(),f=$('#bf').value,s=st.settings,ms=$('#ms').value;
  $('#bl0').innerHTML=st.profiles.map((p,i)=>({p,i})).filter(({p})=>(!f||p.loader==f)&&(p.name+p.mc).toLowerCase().includes(q)).map(({p,i})=>`<div class="it ${i==st.sel?'on':''}" onclick="sel(${i})"><span class="ic">⛏</span><div><b>${e(p.name)}</b><small>${e(p.mc)} · ${e(p.loader)}</small></div></div>`).join('')||`<p class="mut">${tr('empty')}</p>`;
  const c=P();$('#cur').textContent=c?`${c.name} — ${c.mc} ${c.loader}`:'—';
  const nm=s.mode=='ely'&&s.ely?s.ely.name:s.nick;$('#an').textContent=nm;$('#av').textContent=nm.slice(0,2).toUpperCase();$('#am').textContent=tr(s.mode=='ely'?'ely':'off');$('#hn').textContent=c?c.name:'—';$('#hv').textContent=c?c.mc+' · '+c.loader+' · ⏱ '+dur(c.ms):'';
  if(!$('#pt').textContent)$('#pt').textContent=tr('ready');
  $('#ms').innerHTML=st.profiles.map((p,i)=>`<option value="${i}">${e(p.name)} — ${e(p.mc)} ${e(p.loader)}</option>`).join('');$('#ms').value=ms||st.sel;
  chips();$('#bv').innerHTML=V.map(v=>`<option>${v}</option>`).join('');
  $('#bl2').innerHTML=st.profiles.map((p,i)=>`<div class="card"><div><b>${e(p.name)}</b><p>Minecraft ${e(p.mc)} · ${e(p.loader)} · ⏱ ${dur(p.ms)}</p></div><button class="b g" onclick="addJ(${i})">${tr('addjar')}</button><button class="b g" onclick="R.invoke('folder',st.profiles[${i}].name)">${tr('folder')}</button><button class="b g" onclick="del(${i})">${tr('rm')}</button></div>`).join('');
  $('#fl').innerHTML=st.friends.map((f,i)=>`<div class="card"><div><b>${e(f.n)}</b><p>${e(f.a)} <span id="st${i}"></span></p></div><button class="b g" onclick="pinF(${i})">${f.pin?'★':'☆'}</button><button class="b" onclick="play('${e(f.a)}')">${tr('connect')}</button><button class="b g" onclick="st.friends.splice(${i},1);save();render()">✕</button></div>`).join('');
}
function play(server){if(!P())return;G=[];if(server){st.settings.lastSrv=server;save();chips()}$('#log').textContent='';R.invoke('play',{prof:P(),server,st})}
async function search(){const p=st.profiles[$('#ms').value];if(!p)return;$('#res').textContent=tr('load');
  try{const r=await R.invoke('search',{q:$('#q').value,mc:p.mc,loader:p.loader,cat:$('#cat').value,type:$('#ptype').value});
  $('#res').innerHTML=r.hits.map(h=>`<div class="card"><img src="${e(h.icon_url)}"><div><b>${e(h.title)}</b><p>${e(h.description)}</p><small>⬇ ${h.downloads}</small></div><button class="b" onclick="inst('${e(h.project_id)}',this)">${tr('install')}</button></div>`).join('')||tr('nf')}
  catch(x){$('#res').textContent=tr('err')+': '+x.message}}
async function inst(id,b){b.textContent='…';try{const n=await R.invoke('mod',{prof:st.profiles[$('#ms').value],id,type:$('#ptype').value});b.textContent=tr('done')+(n>1?' (+'+(n-1)+')':'')}catch(x){b.textContent=tr('err');alert(x.message)}}
function mk(){const n=$('#bn').value.replace(/[^\w\- а-яА-Я]/g,'').trim();if(!n||st.profiles.some(p=>p.name==n))return alert(tr('uniq'));
  st.profiles.push({name:n,mc:$('#bv').value,loader:$('#bl').value});st.sel=st.profiles.length-1;save();render();$('#bn').value=''}
function del(i){if(confirm(tr('rmq'))){st.profiles.splice(i,1);st.sel=0;save();render()}}
function addF(){if(!$('#fa').value)return;st.friends.push({n:$('#fn').value||'Friend',a:$('#fa').value});save();render();$('#fn').value=$('#fa').value=''}
async function ely(){try{const r=await R.invoke('ely',{u:$('#eu').value,p:$('#ep').value});st.settings.ely=r;st.settings.mode='ely';$('#sm').value='ely';$('#es').textContent='✔ '+r.name;save();render()}catch(x){$('#es').textContent=tr('lerr')}}
function saveS(){const s=st.settings;s.nick=$('#sn').value.trim()||'Player';s.mode=$('#sm').value;s.ram=+$('#sr').value;s.java=$('#sj').value||'java';s.jvm=$('#sjv').value.trim();s.lang=$('#sl').value;L=s.lang;$('#pt').textContent='';save();$('#modal').classList.remove('on');lang()}
let UP='',SH=[];
const dur=ms=>{const t=Math.round((ms||0)/60000);return Math.floor(t/60)+tr('h')+' '+t%60+tr('m')};
R.on('played',(_,d)=>{const p=st.profiles.find(x=>x.name==d.name);if(p){p.ms=(p.ms||0)+d.ms;save();render()}});
function chips(){const sv=[...(st.settings.lastSrv?[{n:'⏱ '+st.settings.lastSrv,a:st.settings.lastSrv}]:[]),...st.friends.filter(f=>f.pin).map(f=>({n:'★ '+f.n,a:f.a}))];$('#chips').innerHTML=sv.map(x=>`<button class="b g" style="padding:6px 14px;font-size:12px" onclick="play('${e(x.a)}')">${e(x.n)}</button>`).join('')}
function pinF(i){st.friends[i].pin=!st.friends[i].pin;save();render()}
async function importB(){const r=await R.invoke('import',st.profiles.map(p=>p.name));if(!r)return;st.profiles.push({name:r.name,mc:r.mc||$('#bv').value,loader:r.mc?r.loader:$('#bl').value});st.sel=st.profiles.length-1;save();render();alert(tr('imped'))}
async function loadShots(){const p=P();if(!p)return;SH=await R.invoke('shots',p.name);$('#sg').innerHTML=SH.length?SH.map((f,i)=>`<div class="card" style="flex-direction:column;align-items:stretch"><img src="${e(encodeURI('file:///'+f.replace(/\\/g,'/')))}" style="width:100%;height:auto"><div class="row" style="margin:8px 0 0"><button class="b g" onclick="shA(${i},'show')">${tr('show')}</button><button class="b g" onclick="shA(${i},'copy')">${tr('copy')}</button></div></div>`).join(''):`<p>${tr('noshots')}</p>`}
function shA(i,a){R.invoke('shotact',{f:SH[i],a})}
R.on('upd',(_,d)=>{$('#up').style.display='flex';$('#upv').textContent=d.v+(d.s=='dl'?' …':' ✔');$('#upb').style.display=d.s=='ready'?'':'none'});
let ML=[];
let MM={};
async function loadMods(){const p=P();if(!p)return;ML=await R.invoke('modlist',p.name);MM={};if(!$('#mv').options.length)$('#mv').innerHTML=V.map(v=>`<option>${v}</option>`).join('');drawMods();try{MM=await R.invoke('modmeta',p.name);drawMods()}catch{}}
function drawMods(){const q=$('#mq').value.toLowerCase(),f=$('#mf').value,off=ML.filter(m=>!m.enabled).length,iss=ML.filter(m=>m.missing.length).length;
$('#msum').textContent=ML.length+' '+tr('mods')+' · '+off+' '+tr('offc')+' · '+iss+' '+tr('iss')+' · '+tr('dropj');
const ok=m=>{const x=MM[m.file]||{};return(!q||(m.name+m.id+(x.title||'')+(m.desc||'')).toLowerCase().includes(q))&&(!f||(f=='on'&&m.enabled)||(f=='off'&&!m.enabled)||(f=='iss'&&m.missing.length)||(f=='loc'&&!x.slug))};
$('#ml').innerHTML=ML.length?ML.map((m,i)=>[m,i]).filter(([m])=>ok(m)).map(([m,i])=>{const x=MM[m.file]||{},ic=x.icon||m.icon,d=x.desc||m.desc||'';
return `<div class="card" style="opacity:${m.enabled?1:.55};align-items:flex-start"><img src="${e(ic||'')}" onerror="this.style.visibility='hidden'" style="width:56px;height:56px;border-radius:14px;flex:none;background:var(--p)"><div style="min-width:0"><b>${e(x.title||m.name)}</b> <small>${e(m.version)}</small><p style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${e(d)}</p><div class="row" style="margin:6px 0 0;gap:6px"><span class="tag">${x.slug?'Modrinth ✔':tr('local')}</span>${m.authors?`<span class="tag">${e(m.authors.slice(0,40))}</span>`:''}${m.missing.length?`<span class="tag" style="background:#fee2e2;color:#b91c1c">⚠ ${e(m.missing.join(', '))}</span>`:''}${m.needed.length?`<span class="tag">← ${e(m.needed.join(', ').slice(0,60))}</span>`:''}</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:none"><button class="b ${m.enabled?'':'g'}" onclick="togM(${i})">${m.enabled?tr('on'):tr('off')}</button><button class="b g" onclick="scanM(${i})">${tr('scan')}</button>${x.slug?`<button class="b g" onclick="R.invoke('open','https://modrinth.com/mod/${e(x.slug)}')">↗</button>`:''}</div></div>`}).join(''):`<p>${tr('nomods')}</p>`}
async function dropJ(ev){ev.preventDefault();const p=P();if(!p)return;const ps=[...ev.dataTransfer.files].map(f=>(require('electron').webUtils?.getPathForFile(f))||f.path).filter(x=>x&&x.toLowerCase().endsWith('.jar'));if(ps.length){await R.invoke('addjarpaths',{n:p.name,paths:ps});loadMods()}}
async function togM(i){const m=ML[i];if(m.enabled&&m.needed.length&&!confirm(tr('brk')+' '+m.needed.join(', ')))return;await R.invoke('modtoggle',{n:P().name,f:m.file});loadMods()}
async function scanM(i){const r=await R.invoke('modscan',{n:P().name,f:ML[i].file});alert(r.verdict+'\n\n'+r.lines.join('\n'))}
async function tune(){const p=P();if(!p)return;$('#modal').classList.remove('on');document.querySelectorAll('nav button')[4].click();const l=$('#log');l.textContent+='\n⚙ '+tr('tune')+'\n';try{const r=await R.invoke('autotune',{prof:p,mode:$('#tm').value});l.textContent+=r.join('\n')+'\n'}catch(x){l.textContent+='✖ '+x.message+'\n'}l.scrollTop=1e9}
let G=[],SK=null;
R.on('stat',(_,d)=>{G.push(d);if(G.length>100)G.shift();const c=$('#gr'),x=c.getContext('2d'),w=c.width,hh=c.height;x.clearRect(0,0,w,hh);const line=(k,max,col)=>{x.strokeStyle=col;x.lineWidth=3;x.beginPath();G.forEach((p,i)=>{const X=i/99*w,Y=hh-Math.min(1,p[k]/max)*(hh-34)-4;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()};line('ram',st.settings.ram,'#65a30d');line('cpu',100,'#f59e0b');x.fillStyle='#365314';x.font='22px sans-serif';x.fillText('RAM '+d.ram+' MB   ·   CPU '+d.cpu+'%',10,24)});
function pingAll(){st.friends.forEach((f,i)=>{const s=$('#st'+i);if(s)s.textContent='⏳';R.invoke('ping',f.a).then(r=>{const s2=$('#st'+i);if(s2)s2.textContent=r.ok?`🟢 ${r.online}/${r.max} · ${r.ms} ms`:'🔴'})})}
async function updM(){const p=P();if(!p)return;let u;try{u=await R.invoke('modcheck',{prof:p})}catch(x){return alert(x.message)}if(!u.length)return alert(tr('uptd'));if(confirm(tr('updq')+'\n'+u.map(x=>x.old+' → '+x.file).join('\n'))){await R.invoke('modupdate',{n:p.name,items:u});alert(tr('updd'));loadMods()}}
function drawSkin(img){const c=$('#skc'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);const s=8,q=(sx,sy,w,hh,dx,dy)=>x.drawImage(img,sx,sy,w,hh,dx*s,dy*s,w*s,hh*s),old=img.height<64;q(8,8,8,8,4,0);q(20,20,8,12,4,8);q(44,20,4,12,0,8);q(old?44:36,old?20:52,4,12,12,8);q(4,20,4,12,4,20);q(old?4:20,old?20:52,4,12,8,20);q(40,8,8,8,4,0);if(!old){q(20,36,8,12,4,8);q(44,36,4,12,0,8);q(52,52,4,12,12,8);q(4,36,4,12,4,20);q(4,52,4,12,8,20)}}
function skShow(src){const img=new Image();img.onload=()=>{drawSkin(img);$('#skm').textContent=''};img.onerror=()=>{$('#skc').getContext('2d').clearRect(0,0,128,256);$('#skm').textContent=tr('sknf')};img.src=src}
const skNick=()=>st.settings.mode=='ely'&&st.settings.ely?st.settings.ely.name:st.settings.nick;
function skEly(){SK=null;skShow('https://skinsystem.ely.by/skins/'+encodeURIComponent(skNick())+'.png')}
async function skPick(){const r=await R.invoke('skinpick');if(!r)return;SK=r.path;skShow(r.data)}
async function skApply(){if(!SK||!P())return;const ok=await R.invoke('skinapply',{prof:P(),nick:skNick(),src:SK});alert(ok?tr('skok'):tr('err'))}
async function migr(){const p=P(),mc=$('#mv').value;if(!p||!mc||mc==p.mc)return;if(!confirm(tr('migq')+' '+mc+'?'))return;document.querySelectorAll('nav button')[4].click();const l=$('#log');l.textContent+='\n⇪ '+p.name+' → '+mc+'\n';try{const r=await R.invoke('migrate',{prof:p,mc,existing:st.profiles.map(x=>x.name)});st.profiles.push({name:r.name,mc,loader:p.loader});st.sel=st.profiles.length-1;save();render();l.textContent+='✔ '+r.ok.length+'  ✖ '+r.fail.length+'\n'+r.fail.map(x=>'   ✖ '+x).join('\n')+'\n'+tr('migd')+'\n'}catch(x){l.textContent+='✖ '+x.message+'\n'}l.scrollTop=1e9}
function tg(){R.invoke('tg')}
function hideAd(){st.settings.adHidden=true;save();$('#ad').style.display='none'}
async function diag(){const p=P();if(!p)return;document.querySelectorAll('nav button')[4].click();const l=$('#log');l.textContent+='\n🛠 '+tr('fixing')+'\n';try{const r=await R.invoke('diagnose',{prof:p,st});l.textContent+=r.out.join('\n')+'\n';if(r.suspects.length&&confirm(tr('offq')+'\n'+r.suspects.map(x=>x.name).join(', '))){for(const x of r.suspects)await R.invoke('modtoggle',{n:p.name,f:x.file});l.textContent+='🔧 '+tr('offd')+'\n'}}catch(x){l.textContent+='✖ '+x.message+'\n'}l.scrollTop=1e9}
async function addJ(i){const n=await R.invoke('addjars',st.profiles[i].name);if(n)alert(n+' .jar ✔')}
(async()=>{$('#au1').textContent=$('#au2').textContent=AUTHOR;const s=await R.invoke('get');st={...st,...s,settings:{...st.settings,...s.settings}};
  try{V=await R.invoke('versions')}catch{}
  if(!st.profiles.length&&V.length){st.profiles.push({name:'Vanilla',mc:V[0],loader:'vanilla'});save()}
  const s2=st.settings;if(s2.adHidden)$('#ad').style.display='none';L=s2.lang||(navigator.language.startsWith('ru')?'ru':'en');
  $('#sn').value=s2.nick;$('#sm').value=s2.mode;$('#sr').value=s2.ram;$('#rv').textContent=s2.ram;$('#sj').value=s2.java;$('#sjv').value=s2.jvm||'';$('#sl').value=L;if(s2.ely)$('#es').textContent='✔ '+s2.ely.name;
  lang();if(!V.length)$('#pt').textContent=tr('nov')})();
</script></body></html>
