<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Lime Launcher</title>
<style>
:root{--l:#84cc16;--ll:#a3e635;--p:#ecfccb;--s:#f7fee7;--d:#1a2e05;--m:#4d7c0f}
*{box-sizing:border-box;margin:0;font-family:'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;height:100vh;background:#fff;color:var(--d);overflow:hidden}
.top{height:42px;background:linear-gradient(90deg,#14240a,#3f6212);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:700;font-size:15px}
.top b{color:var(--ll)}.top span{color:#fff}.lg{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9f99d,var(--l))}
.wrap{display:flex;flex:1;min-height:0}
nav{width:88px;background:var(--s);border-right:1px solid #d9f99d;padding:12px 8px;display:flex;flex-direction:column;gap:6px}
nav button{background:none;border:0;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--m);transition:.15s}
nav button i{font-style:normal;font-size:24px}nav button small{font-size:11px;color:inherit;font-weight:600}
nav button:hover{background:var(--p)}nav button.on{background:linear-gradient(135deg,var(--ll),var(--l));color:var(--d);box-shadow:0 4px 10px #84cc1655}
main{flex:1;padding:22px 26px;overflow:auto;background:linear-gradient(160deg,#fff 45%,var(--s))}
section{display:none}section.on{display:block}h1{font-size:26px;margin-bottom:16px}
.card,.panel{background:#fff;border:1px solid #d9f99d;border-radius:20px;box-shadow:0 4px 14px #84cc1622}
.card{padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}.card img{width:52px;height:52px;border-radius:14px;background:var(--p)}.card>div{flex:1}
p,small{font-size:13px;color:var(--m)}.mut{padding:12px}
.b{background:linear-gradient(135deg,var(--ll),var(--l));color:var(--d);border:0;border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer;transition:.15s}.b:hover{transform:translateY(-1px);box-shadow:0 4px 12px #84cc1666}.b.g{background:var(--p)}
input,select{border:1px solid #bef264;border-radius:999px;padding:9px 16px;background:#fff;font-size:14px;color:var(--d);max-width:100%}input:focus,select:focus{outline:2px solid var(--ll)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.home{display:grid;grid-template-columns:310px 1fr;gap:16px;height:calc(100vh - 42px - 96px)}
.panel{padding:14px;display:flex;flex-direction:column;min-height:0}.panel h3{margin-bottom:10px}
.list{overflow:auto;flex:1;margin-top:10px}.it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;cursor:pointer}.it:hover{background:var(--s)}.it.on{background:var(--p);outline:1px solid var(--ll)}.it .ic{font-size:22px}.it small{display:block}
.acc{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:14px}.card>.av{flex:none}.av{width:46px;height:46px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--ll),var(--l));display:grid;place-items:center;font-weight:800}
.hero{flex:1;border-radius:22px;background:linear-gradient(135deg,var(--p),#fff 70%);border:1px solid #d9f99d;padding:26px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.hero h2{font-size:34px}#bar{height:10px;background:#fff;border:1px solid #d9f99d;border-radius:999px;overflow:hidden;margin:18px 0 6px}#pb{height:100%;width:0;background:linear-gradient(90deg,var(--ll),var(--l));transition:.2s}
.bot{display:flex;gap:12px;align-items:center;margin-top:14px}.bot .cur{flex:1;background:var(--s);border:1px solid #d9f99d;border-radius:999px;padding:15px 22px;font-weight:600}.big{font-size:18px;padding:15px 48px}
#log{background:var(--s);border:1px solid #d9f99d;border-radius:20px;height:calc(100vh - 42px - 110px);overflow:auto;padding:14px;font:12px Consolas,monospace;white-space:pre-wrap}
#modal{display:none;position:fixed;inset:0;background:#14240a99;align-items:center;justify-content:center}#modal.on{display:flex}
.box{background:#fff;border-radius:26px;padding:26px;width:450px;max-height:92vh;overflow:auto}.box label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}.box input,.box select{width:100%}
</style></head><body>
<div class="top"><i class="lg"></i><div><b>Lime</b> <span>Launcher</span></div></div>
<div class="wrap">
<nav>
  <button class="on" onclick="tab('play',this)"><i>🏠</i><small data-i="play"></small></button>
  <button onclick="tab('mods',this)"><i>🧩</i><small data-i="mods"></small></button>
  <button onclick="tab('builds',this)"><i>📦</i><small data-i="builds"></small></button>
  <button onclick="tab('friends',this)"><i>👥</i><small data-i="friends"></small></button>
  <button onclick="tab('logs',this)"><i>📜</i><small data-i="logs"></small></button>
  <button onclick="$('#modal').classList.add('on')" style="margin-top:auto"><i>⚙</i><small data-i="settings"></small></button>
</nav>
<main>
<section id="play" class="on"><h1 data-i="play"></h1>
 <div class="home">
  <div class="panel"><h3 data-i="pick"></h3>
   <div class="row" style="margin:0"><input id="bq" data-p="search_b" oninput="render()" style="flex:1;min-width:0">
   <select id="bf" onchange="render()"><option value="" data-i="all"></option><option value="vanilla">Vanilla</option><option value="fabric">Fabric</option><option value="forge">Forge</option><option value="neoforge">NeoForge</option></select></div>
   <div class="list" id="bl0"></div></div>
  <div style="display:flex;flex-direction:column;min-height:0">
   <div class="card acc"><div class="av" id="av">PL</div><div style="flex:1"><b id="an"></b><p id="am"></p></div><button class="b g" onclick="toggleLang()">RU / EN</button></div>
   <div class="hero"><small>Minecraft</small><h2 id="hn"></h2><p id="hv"></p><div id="bar"><div id="pb"></div></div><span id="pt" style="font-size:13px;color:var(--m)"></span></div>
   <div class="bot"><div class="cur" id="cur"></div><button class="b big" onclick="play()" data-i="launch"></button></div>
  </div></div></section>
<section id="mods"><h1 data-i="mods_t"></h1>
 <div class="row"><select id="ms"></select><input id="q" data-p="search_m" onkeydown="if(event.key=='Enter')search()" style="flex:1">
 <select id="cat"><option value="" data-i="allc"></option><option>optimization</option><option>adventure</option><option>decoration</option><option>technology</option><option>magic</option><option>utility</option><option>library</option><option>worldgen</option><option>equipment</option><option>food</option></select>
 <button class="b" onclick="search()" data-i="find"></button></div><div id="res"></div></section>
<section id="builds"><h1 data-i="builds"></h1>
 <div class="row"><input id="bn" data-p="b_name"><select id="bv"></select>
 <select id="bl"><option value="vanilla">Vanilla</option><option value="fabric">Fabric</option><option value="forge">Forge</option><option value="neoforge">NeoForge (1.20.2+)</option></select>
 <button class="b" onclick="mk()" data-i="create"></button></div><div id="bl2"></div></section>
<section id="friends"><h1 data-i="friends_t"></h1><p style="margin-bottom:14px" data-i="f_hint"></p>
 <div class="row"><input id="fn" data-p="f_name"><input id="fa" data-p="f_addr"><button class="b" onclick="addF()" data-i="add"></button></div><div id="fl"></div></section>
<section id="logs"><h1 data-i="logs"></h1><div id="log"></div></section>
</main></div>
<div id="modal"><div class="box"><h1 style="font-size:22px">⚙ <span data-i="settings"></span></h1>
 <label data-i="s_lang"></label><select id="sl"><option value="ru">Русский</option><option value="en">English</option></select>
 <label data-i="s_nick"></label><input id="sn" maxlength="16">
 <label data-i="s_acc"></label><select id="sm"><option value="offline" data-i="s_off"></option><option value="ely">Ely.by</option></select>
 <label>Ely.by</label><input id="eu" data-p="eu"><input id="ep" type="password" data-p="ep" style="margin-top:6px">
 <button class="b g" style="margin-top:8px" onclick="ely()" data-i="s_login"></button> <small id="es"></small>
 <label><span data-i="s_ram"></span>: <span id="rv"></span> MB</label><input id="sr" type="range" min="1024" max="16384" step="512" oninput="$('#rv').textContent=this.value">
 <label data-i="s_java"></label><input id="sj" placeholder="java"><p style="margin-top:6px" data-i="s_hint"></p>
 <div class="row" style="margin-top:16px"><button class="b" onclick="saveS()" data-i="save"></button><button class="b g" onclick="$('#modal').classList.remove('on')" data-i="close"></button></div></div></div>
<script>
const {ipcRenderer:R}=require('electron'),$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const T={ru:{play:'Главная',logs:'Журнал',mods:'Моды',builds:'Сборки',friends:'Друзья',settings:'Настройки',pick:'Выберите сборку',search_b:'Поиск сборки…',all:'Все',allc:'Все категории',launch:'ИГРАТЬ',ready:'Готов к запуску',off:'Офлайн-аккаунт',ely:'Аккаунт Ely.by',mods_t:'Моды Modrinth',search_m:'Поиск модов…',find:'Найти',install:'Установить',done:'✔ Готово',err:'Ошибка',nf:'Ничего не найдено',load:'Загрузка…',b_name:'Название сборки',create:'Создать',folder:'Папка',rm:'Удалить',rmq:'Убрать сборку из списка? (файлы останутся в папке)',uniq:'Введите уникальное название',friends_t:'Игра с друзьями',f_hint:'Добавьте адрес сервера или IP друга (Radmin VPN, ZeroTier, playit.gg) и подключайтесь в один клик. Сборка берётся с главной страницы.',f_name:'Имя друга / сервер',f_addr:'IP:порт (25565)',add:'Добавить',connect:'Подключиться',s_lang:'Язык',s_nick:'Ник (офлайн-режим)',s_acc:'Аккаунт',s_off:'Офлайн (ник)',eu:'Логин или e-mail',ep:'Пароль',s_login:'Войти в Ely.by',s_ram:'Память',s_java:'Путь к Java (java.exe)',s_hint:'Оставьте «java» — лаунчер сам скачает нужную Java для каждой версии игры. Свой путь указывайте только при необходимости.',save:'Сохранить',close:'Закрыть',empty:'Сборок нет',nov:'Нет связи с серверами Mojang',lerr:'Ошибка входа',pr:{}},
en:{play:'Home',logs:'Logs',mods:'Mods',builds:'Builds',friends:'Friends',settings:'Settings',pick:'Pick a build',search_b:'Search builds…',all:'All',allc:'All categories',launch:'PLAY',ready:'Ready to launch',off:'Offline account',ely:'Ely.by account',mods_t:'Modrinth mods',search_m:'Search mods…',find:'Search',install:'Install',done:'✔ Done',err:'Error',nf:'Nothing found',load:'Loading…',b_name:'Build name',create:'Create',folder:'Folder',rm:'Remove',rmq:'Remove build from the list? (files stay on disk)',uniq:'Enter a unique name',friends_t:'Play with friends',f_hint:'Add a server address or a friend’s IP (Radmin VPN, ZeroTier, playit.gg) and join in one click. The build is taken from Home.',f_name:'Friend / server name',f_addr:'IP:port (25565)',add:'Add',connect:'Connect',s_lang:'Language',s_nick:'Nickname (offline mode)',s_acc:'Account',s_off:'Offline (nickname)',eu:'Login or e-mail',ep:'Password',s_login:'Sign in to Ely.by',s_ram:'Memory',s_java:'Java path (java.exe)',s_hint:'Keep “java” — the launcher downloads the right Java for each game version automatically. Set a custom path only if needed.',save:'Save',close:'Close',empty:'No builds',nov:'Cannot reach Mojang servers',lerr:'Login failed',pr:{'Подготовка':'Preparing','Библиотеки':'Libraries','Ресурсы':'Assets','Игра запущена':'Game started','Ошибка':'Error','Вход Ely.by…':'Ely.by login…','Игра закрыта':'Game closed'}}};
let L='ru',st={settings:{nick:'Player',ram:4096,java:'java',mode:'offline',ely:null,lang:''},profiles:[],friends:[],sel:0},V=[];
const tr=k=>T[L][k]??k,save=()=>R.invoke('set',st),P=()=>st.profiles[st.sel]||st.profiles[0];
R.on('progress',(_,d)=>{let t=d.t;for(const k in T[L].pr)if(t.startsWith(k))t=T[L].pr[k]+t.slice(k.length);$('#pt').textContent=t;$('#pb').style.width=d.p+'%'});
R.on('log',(_,t)=>{const l=$('#log');l.textContent+=t;l.scrollTop=1e9});
R.on('ely',(_,x)=>{st.settings.ely=x;save()});
function tab(n,b){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==n));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function lang(){document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(x=>x.textContent=tr(x.dataset.i));document.querySelectorAll('[data-p]').forEach(x=>x.placeholder=tr(x.dataset.p));render()}
function toggleLang(){L=L=='ru'?'en':'ru';st.settings.lang=L;$('#sl').value=L;$('#pt').textContent='';save();lang()}
function sel(i){st.sel=i;save();render()}
function render(){
  const q=$('#bq').value.toLowerCase(),f=$('#bf').value,s=st.settings,ms=$('#ms').value;
  $('#bl0').innerHTML=st.profiles.map((p,i)=>({p,i})).filter(({p})=>(!f||p.loader==f)&&(p.name+p.mc).toLowerCase().includes(q)).map(({p,i})=>`<div class="it ${i==st.sel?'on':''}" onclick="sel(${i})"><span class="ic">⛏</span><div><b>${e(p.name)}</b><small>${e(p.mc)} · ${e(p.loader)}</small></div></div>`).join('')||`<p class="mut">${tr('empty')}</p>`;
  const c=P();$('#cur').textContent=c?`${c.name} — ${c.mc} ${c.loader}`:'—';
  const nm=s.mode=='ely'&&s.ely?s.ely.name:s.nick;$('#an').textContent=nm;$('#av').textContent=nm.slice(0,2).toUpperCase();$('#am').textContent=tr(s.mode=='ely'?'ely':'off');$('#hn').textContent=c?c.name:'—';$('#hv').textContent=c?c.mc+' · '+c.loader:'';
  if(!$('#pt').textContent)$('#pt').textContent=tr('ready');
  $('#ms').innerHTML=st.profiles.map((p,i)=>`<option value="${i}">${e(p.name)} — ${e(p.mc)} ${e(p.loader)}</option>`).join('');$('#ms').value=ms||st.sel;
  $('#bv').innerHTML=V.map(v=>`<option>${v}</option>`).join('');
  $('#bl2').innerHTML=st.profiles.map((p,i)=>`<div class="card"><div><b>${e(p.name)}</b><p>Minecraft ${e(p.mc)} · ${e(p.loader)}</p></div><button class="b g" onclick="R.invoke('folder',st.profiles[${i}].name)">${tr('folder')}</button><button class="b g" onclick="del(${i})">${tr('rm')}</button></div>`).join('');
  $('#fl').innerHTML=st.friends.map((f,i)=>`<div class="card"><div><b>${e(f.n)}</b><p>${e(f.a)}</p></div><button class="b" onclick="play('${e(f.a)}')">${tr('connect')}</button><button class="b g" onclick="st.friends.splice(${i},1);save();render()">✕</button></div>`).join('');
}
function play(server){if(!P())return;$('#log').textContent='';R.invoke('play',{prof:P(),server,st})}
async function search(){const p=st.profiles[$('#ms').value];if(!p)return;$('#res').textContent=tr('load');
  try{const r=await R.invoke('search',{q:$('#q').value,mc:p.mc,loader:p.loader,cat:$('#cat').value});
  $('#res').innerHTML=r.hits.map(h=>`<div class="card"><img src="${e(h.icon_url)}"><div><b>${e(h.title)}</b><p>${e(h.description)}</p><small>⬇ ${h.downloads}</small></div><button class="b" onclick="inst('${e(h.project_id)}',this)">${tr('install')}</button></div>`).join('')||tr('nf')}
  catch(x){$('#res').textContent=tr('err')+': '+x.message}}
async function inst(id,b){b.textContent='…';try{const n=await R.invoke('mod',{prof:st.profiles[$('#ms').value],id});b.textContent=tr('done')+(n>1?' (+'+(n-1)+')':'')}catch(x){b.textContent=tr('err');alert(x.message)}}
function mk(){const n=$('#bn').value.replace(/[^\w\- а-яА-Я]/g,'').trim();if(!n||st.profiles.some(p=>p.name==n))return alert(tr('uniq'));
  st.profiles.push({name:n,mc:$('#bv').value,loader:$('#bl').value});st.sel=st.profiles.length-1;save();render();$('#bn').value=''}
function del(i){if(confirm(tr('rmq'))){st.profiles.splice(i,1);st.sel=0;save();render()}}
function addF(){if(!$('#fa').value)return;st.friends.push({n:$('#fn').value||'Friend',a:$('#fa').value});save();render();$('#fn').value=$('#fa').value=''}
async function ely(){try{const r=await R.invoke('ely',{u:$('#eu').value,p:$('#ep').value});st.settings.ely=r;st.settings.mode='ely';$('#sm').value='ely';$('#es').textContent='✔ '+r.name;save();render()}catch(x){$('#es').textContent=tr('lerr')}}
function saveS(){const s=st.settings;s.nick=$('#sn').value.trim()||'Player';s.mode=$('#sm').value;s.ram=+$('#sr').value;s.java=$('#sj').value||'java';s.lang=$('#sl').value;L=s.lang;$('#pt').textContent='';save();$('#modal').classList.remove('on');lang()}
(async()=>{const s=await R.invoke('get');st={...st,...s,settings:{...st.settings,...s.settings}};
  try{V=await R.invoke('versions')}catch{}
  if(!st.profiles.length&&V.length){st.profiles.push({name:'Vanilla',mc:V[0],loader:'vanilla'});save()}
  const s2=st.settings;L=s2.lang||(navigator.language.startsWith('ru')?'ru':'en');
  $('#sn').value=s2.nick;$('#sm').value=s2.mode;$('#sr').value=s2.ram;$('#rv').textContent=s2.ram;$('#sj').value=s2.java;$('#sl').value=L;if(s2.ely)$('#es').textContent='✔ '+s2.ely.name;
  lang();if(!V.length)$('#pt').textContent=tr('nov')})();
</script></body></html>
